<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日興奮, Honey 💛</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Caveat:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcf9f5;
            --card-bg: #fffdf9;
            --accent-yellow: #f4a261;
            --accent-orange: #e76f51;
            --text-main: #2b2b2b;
            --text-muted: #666666;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(#e9d8c5 0.75px, transparent 0.75px);
            background-size: 24px 24px;
        }

        .postcard-container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 4px;
            box-shadow: 0 20px 40px rgba(231, 111, 81, 0.08), 0 2px 6px rgba(0,0,0,0.04);
            position: relative;
            border: 1px solid #f0e6dc;
            transform: rotate(-0.5deg);
            transition: transform 0.3s ease;
        }

        .postcard-container:hover {
            transform: rotate(0deg);
        }

        /* Stamp image area */
        .stamp-area {
            position: absolute;
            top: 35px;
            right: 40px;
            width: 75px;
            height: 90px;
            border: 2px solid #f0e6dc;
            padding: 4px;
            background: #ffffff;
            transform: rotate(3deg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .stamp-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 600;
            color: #2c2c2c;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 35px;
        }

        .message-body {
            font-family: 'Caveat', cursive;
            font-size: 1.8rem;
            line-height: 1.6;
            color: #333333;
            margin-bottom: 40px;
            padding-right: 50px;
        }

        .highlight-word {
            color: var(--accent-orange);
            border-bottom: 1px dashed var(--accent-yellow);
        }

        .footer-note {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px solid #f0e6dc;
            padding-top: 20px;
        }

        .from-tag {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .signature {
            font-family: 'Caveat', cursive;
            font-size: 2rem;
            color: var(--accent-orange);
        }

        @media (max-width: 600px) {
            .postcard-container {
                padding: 25px;
            }
            .stamp-area {
                top: 25px;
                right: 25px;
                width: 60px;
                height: 75px;
            }
            header h1 {
                font-size: 1.8rem;
            }
            .message-body {
                font-size: 1.5rem;
                padding-right: 0;
            }
        }
    </style>
</head>
<body>

    <div class="postcard-container">
        <div class="stamp-area">
            <img src="cute-honey.png" alt="Cap's Stamp">
        </div>

        <header>
            <h1>生日興奮, Honey.</h1>
            <div class="subtitle">致充滿溫暖的你</div>
        </header>

        <div class="message-body">
            給溫暖的 Cap，<br>
            你總是用心地把生活過成一首詩，把 <span class="highlight-word">溫暖</span> 和許多美好的儀式感帶進我們身邊，就像一抹溫柔的 <span class="highlight-word">黃與橙色</span> 夕陽。<br><br>
            願這新的一年裡，也能擁有滿滿的平靜喜悅、閃閃發光的溫柔回憶，就像你一直以來帶給身邊人的那樣。今天一定要過得最舒服、最開心喔！ 💛
        </div>

        <div class="footer-note">
            <div class="from-tag">SPECIAL DELIVERY · TODAY</div>
            <div class="signature">from coffeemiao</div>
        </div>
    </div>

</body>
</html>
