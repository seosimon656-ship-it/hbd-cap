<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日興奮啊，Honey 💛</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Caveat:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcf9f5;
            --card-bg: #fffdf9;
            --accent-yellow: #f4a261;
            --accent-orange: #e76f51;
            --text-main: #2b2b2b;
            --text-muted: #666666;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(#e9d8c5 0.75px, transparent 0.75px);
            background-size: 24px 24px;
        }

        .postcard-container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 4px;
            box-shadow: 0 20px 40px rgba(231, 111, 81, 0.08), 0 2px 6px rgba(0,0,0,0.04);
            position: relative;
            border: 1px solid #f0e6dc;
            transform: rotate(-0.5deg);
            transition: transform 0.3s ease;
        }

        .postcard-container:hover {
            transform: rotate(0deg);
        }

        /* Stamp image area - 放大版郵票 */
        .stamp-area {
            position: absolute;
            top: 35px;
            right: 40px;
            width: 95px;
            height: 115px;
            border: 2px solid #f0e6dc;
            padding: 5px;
            background: #ffffff;
            transform: rotate(3deg);
            box-shadow: 0 3px 8px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .stamp-area:hover {
            transform: rotate(0deg) scale(1.05);
        }

        .stamp-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 600;
            color: #2c2c2c;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 35px;
        }

        .message-body {
            font-family: 'Caveat', cursive;
            font-size: 1.7rem;
            line-height: 1.6;
            color: #333333;
            margin-bottom: 40px;
            padding-right: 50px;
        }

        .highlight-word {
            color: var(--accent-orange);
            border-bottom: 1px dashed var(--accent-yellow);
        }

        .footer-note {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px solid #f0e6dc;
            padding-top: 20px;
        }

        .from-tag {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .signature {
            font-family: 'Caveat', cursive;
            font-size: 2rem;
            color: var(--accent-orange);
        }

        @media (max-width: 600px) {
            .postcard-container {
                padding: 25px;
            }
            .stamp-area {
                top: 25px;
                right: 25px;
                width: 75px;
                height: 95px;
            }
            header h1 {
                font-size: 1.8rem;
            }
            .message-body {
                font-size: 1.45rem;
                padding-right: 0;
            }
        }
    </style>
</head>
<body>

    <div class="postcard-container">
        <div class="stamp-area" title="點擊或長按可儲存圖片">
            <a href="cute-honey.png" target="_blank">
                <img src="cute-honey.png" alt="Cap's Stamp">
            </a>
        </div>

        <header>
            <h1>Happy Birthday, Honey.</h1>
            <div class="subtitle">給老是毛毛躁躁的 Cap</div>
        </header>

        <div class="message-body">
            喂，講真的，沒想到追星的路上會突然撿到你這麼個寶藏朋友。<br>
            慶幸這世界上還有像你這樣的人，讓我覺得世界其實還蠻美好的。<br><br>
            雖然你平時毛毛躁躁又愛害羞，但其實細心又<span class="highlight-word">溫暖</span>，重點是還非常好逗、好玩 😆<br>
            新的一年，希望你繼續做你自己想做的事。不管過得開不開心、踩到什麼坑，需要我的時候，我盡量在啦！<br><br>
            生日興奮啦，今天記得吃好一點！💛
        </div>

        <div class="footer-note">
            <div class="from-tag">SPECIAL DELIVERY · TODAY</div>
            <div class="signature">coffeemiao</div>
        </div>
    </div>

</body>
</html>
